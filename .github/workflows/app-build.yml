name: Focused Vue unit tests

on:
  pull_request:
    branches:
      - main

jobs:
  focused-unit-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.2'
          cache: npm
      - run: npm ci
      - name: Run Vue unit tests
        run: npm run test:unit
      - name: Build production web bundle
        run: npm run build
      - name: Lint realtime request lifecycle changes
        run: npx oxlint src/composables/usePresence.js src/utils/presenceActivity.js src/utils/presenceActivity.test.js src/layouts/MainLayout.vue src/App.vue src/utils/singleFlight.js src/utils/singleFlight.test.js src/services/pusherManager.js src/services/supportRealtime.js src/utils/supportRealtime.test.js src/utils/pushRegistration.js src/utils/pushRegistration.test.js src/utils/auth.js src/plugins/axios.js src/services/pushNotifications.js src/views/Notification.vue src/views/wallet/Add.vue src/views/wallet/Withdraw.vue
